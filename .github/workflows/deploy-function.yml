name: Deploy Supabase Function

# Publica supabase/functions/cave-board en Supabase cada vez que cambia en main.
# Usa el secreto SUPABASE_ACCESS_TOKEN (Supabase -> Account -> Access Tokens) de
# Settings -> Secrets and variables -> Actions. Al lanzarlo a mano se puede pasar
# un token de un solo uso en "access_token"; se lee del evento y se enmascara para
# que nunca aparezca en los registros.

on:
  push:
    branches:
      - main
    paths:
      - supabase/functions/**
  workflow_dispatch:
    inputs:
      access_token:
        description: Token de Supabase de un solo uso (opcional si existe el secreto)
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar token
        id: token
        env:
          SECRET_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          token=$(jq -r '.inputs.access_token // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
          else
            token="$SECRET_TOKEN"
          fi
          if [ -z "$token" ]; then
            echo "::warning::No se publico la funcion: falta el secreto SUPABASE_ACCESS_TOKEN (Supabase -> Account -> Access Tokens, luego Settings -> Secrets and variables -> Actions)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Instalar Supabase CLI
        if: steps.token.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar cave-board
        if: steps.token.outputs.ready == 'true'
        run: supabase functions deploy cave-board --project-ref cgquvuclhkqxwebpgsdx --use-api

      - name: Comprobar que el tablero responde
        if: steps.token.outputs.ready == 'true'
        run: |
          sleep 10
          code=$(curl -s -o /tmp/board.json -w '%{http_code}' -H "Origin: https://isaaclorenzo.github.io" https://cgquvuclhkqxwebpgsdx.supabase.co/functions/v1/cave-board)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then jq -r '.error // "sin detalle"' /tmp/board.json; exit 1; fi
          jq -r '"Proyectos: \(.data | length) (en papelera: \([.data[] | select(.deleted_at != null)] | length)) | Cobros sueltos: \(.debts | length)"' /tmp/board.json
