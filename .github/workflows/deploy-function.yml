name: Deploy Supabase Function

# Publica supabase/functions/cave-board en Supabase cada vez que cambia en main.
# Requiere el secreto SUPABASE_ACCESS_TOKEN (Supabase -> Account -> Access Tokens)
# en Settings -> Secrets and variables -> Actions del repositorio.

on:
  push:
    branches:
      - main
    paths:
      - supabase/functions/**
      - .github/workflows/deploy-function.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN. Crealo en Supabase (Account -> Access Tokens) y agregalo en Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar cave-board
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy cave-board --project-ref cgquvuclhkqxwebpgsdx
